<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="game-version" content="1.0.2.75">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<title>Taterland</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	height: 100dvh;
	overscroll-behavior: none;
	overflow: hidden;
}

body {
	color: white;
	background-color: #12261f;
	touch-action: none;
}

#canvas {
	position: fixed;
	inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
	display: block;
	width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
	height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
	max-width: 100vw;
	max-height: 100dvh;
}

#canvas:focus {
	outline: none;
}

#fullscreen-button {
	position: fixed;
	top: max(8px, env(safe-area-inset-top));
	left: max(8px, env(safe-area-inset-left));
	z-index: 20;
	min-height: 44px;
	width: 44px;
	padding: 0;
	border: 0;
	background: transparent;
	color: #fff3cf;
	display: grid;
	place-items: center;
	cursor: pointer;
	-webkit-tap-highlight-color: transparent;
}
#fullscreen-button svg {
	width: 22px;
	height: 22px;
	fill: none;
	stroke: currentColor;
	stroke-width: 1.8;
	stroke-linecap: round;
	stroke-linejoin: round;
	filter: drop-shadow(0 1px 1px #071a1aaa);
}
#fullscreen-button:hover { color: #fff; }
#fullscreen-button:active { color: #ffe09b; }
#fullscreen-button:focus-visible {
	outline: 1px solid #fff3cf;
	outline-offset: -5px;
	border-radius: 8px;
}
#fullscreen-button .fullscreen-exit { display: none; }
#fullscreen-button[aria-pressed="true"] .fullscreen-enter { display: none; }
#fullscreen-button[aria-pressed="true"] .fullscreen-exit { display: block; }
#fullscreen-hint {
	position: fixed; z-index: 21; left: 10%; right: 10%; bottom: 70px;
	padding: 16px; border-radius: 12px; background: #193c33; color: #fff3cf;
	font: 16px system-ui, sans-serif;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<meta name="theme-color" content="#12261f">
<script>if(location.pathname.endsWith('/')){history.replaceState(null,'',new URL('index.html'+location.search+location.hash,location.href));}</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<button id="fullscreen-button" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen (F11)">
			<svg class="fullscreen-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6M3 3l6 6M15 3h6v6M21 3l-6 6M3 15v6h6M3 21l6-6M15 21h6v-6M21 21l-6-6"/></svg>
			<svg class="fullscreen-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 14 14M5 19 19 5"/></svg>
		</button>
		<div id="fullscreen-hint" role="status" hidden></div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":3238352,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// Keep UI at Retina resolution. FarmViewport independently budgets the 3D farm;
// changing farm quality must never blur menu text, icons or the rocket film.
function getGameCanvasSize(width, height, deviceScale) {
	const w = Math.max(1, Number.isFinite(width) ? width : 1280);
	const h = Math.max(1, Number.isFinite(height) ? height : 800);
	const dpr = Math.max(1, Math.min(2, Number.isFinite(deviceScale) ? deviceScale : 1));
	const scale = Math.min(dpr, 3840 / w, 2400 / h, Math.sqrt(8294400 / (w * h)));
	return [Math.max(1, Math.floor(w * scale)), Math.max(1, Math.floor(h * scale))];
}

(function () {
	const canvas = document.getElementById('canvas');
	const fullButton = document.getElementById('fullscreen-button');
	const fullHint = document.getElementById('fullscreen-hint');
	let hintTimer;
	window.taterFullscreen = async function () {
		try {
			if (document.fullscreenElement || document.webkitFullscreenElement) {
				await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
			} else if (document.documentElement.requestFullscreen) {
				await document.documentElement.requestFullscreen();
			} else if (document.documentElement.webkitRequestFullscreen) {
				document.documentElement.webkitRequestFullscreen();
			} else {
				throw new Error('unavailable');
			}
		} catch (_) {
			fullHint.textContent = /iPhone|iPad|iPod/.test(navigator.userAgent) || navigator.maxTouchPoints > 0 && /Mac/.test(navigator.platform)
				? 'For a full-screen game on this device, use Share → Add to Home Screen, then open Taterland from that icon. Pinch the farm to zoom.'
				: 'Fullscreen is unavailable here. Open the game in its own browser tab or maximize the window. Pinch or scroll the farm to zoom.';
			fullHint.hidden = false;
			clearTimeout(hintTimer);
			hintTimer = setTimeout(() => { fullHint.hidden = true; }, 9000);
		} finally {
			canvas.focus?.({ preventScroll: true });
		}
	};
	fullButton.addEventListener('click', window.taterFullscreen);
	function updateFullButton() {
		const active = !!(document.fullscreenElement || document.webkitFullscreenElement);
		fullButton.setAttribute('aria-pressed', String(active));
		const label = active ? 'Exit fullscreen' : 'Enter fullscreen';
		fullButton.setAttribute('aria-label', label);
		fullButton.title = label + ' (F11)';
		canvas.focus?.({ preventScroll: true });
		queueCanvasResize();
	}
	document.addEventListener('fullscreenchange', updateFullButton);
	document.addEventListener('webkitfullscreenchange', updateFullButton);
	document.addEventListener('keydown', (event) => {
		if (event.code === 'F11') { event.preventDefault(); event.stopImmediatePropagation(); window.taterFullscreen(); }
	}, true);
	let resizeQueued = false;
	function fitGameCanvas() {
		resizeQueued = false;
		const bounds = canvas.getBoundingClientRect();
		const [width, height] = getGameCanvasSize(bounds.width, bounds.height, window.devicePixelRatio);
		if (canvas.width !== width) canvas.width = width;
		if (canvas.height !== height) canvas.height = height;
	}
	function queueCanvasResize() {
		if (!resizeQueued) {
			resizeQueued = true;
			requestAnimationFrame(fitGameCanvas);
		}
	}
	fitGameCanvas();
	window.addEventListener('resize', queueCanvasResize);
	document.addEventListener('fullscreenchange', queueCanvasResize);
	if (window.visualViewport) window.visualViewport.addEventListener('resize', queueCanvasResize);
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			fitGameCanvas();
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
